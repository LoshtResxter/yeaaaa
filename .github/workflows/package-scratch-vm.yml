name: Package Scratch VM runtime

on:
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime dependencies
        run: |
          mkdir vm-runtime
          cd vm-runtime
          npm init -y
          npm install --omit=dev scratch-vm scratch-storage
          tar -czf ../scratch-vm-runtime.tar.gz node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: scratch-vm-runtime
          path: scratch-vm-runtime.tar.gz
          retention-days: 1
