name: Fetch SRB2 2.2.15 source

on:
  pull_request:
    branches: [main]

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact SRB2 release
        uses: actions/checkout@v4
        with:
          repository: STJr/SRB2
          ref: SRB2_release_2.2.15
          path: SRB2-2.2.15
      - name: Package source used by Scratch port
        run: |
          mkdir artifact
          tar -czf artifact/SRB2-2.2.15-source.tar.gz \
            SRB2-2.2.15/src \
            SRB2-2.2.15/LICENSE \
            SRB2-2.2.15/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: srb2-2.2.15-source
          path: artifact/SRB2-2.2.15-source.tar.gz
          retention-days: 1
