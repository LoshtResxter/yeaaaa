name: Scratch project download

on:
  push:
    branches: [main]

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Scratch downloader
        run: npm install @turbowarp/sbdl@7.0.0
      - name: Download project 1364904198
        run: |
          npx sbdl 'https://scratch.mit.edu/projects/1364904198/'
          mkdir -p artifact
          FILE="$(find . -maxdepth 1 -type f -name '*.sb3' | head -n 1)"
          test -n "$FILE"
          mv "$FILE" artifact/SRB2_source_1364904198.sb3
          ls -lh artifact/SRB2_source_1364904198.sb3
      - uses: actions/upload-artifact@v4
        with:
          name: scratch-project-1364904198
          path: artifact/SRB2_source_1364904198.sb3
          if-no-files-found: error
          retention-days: 1
