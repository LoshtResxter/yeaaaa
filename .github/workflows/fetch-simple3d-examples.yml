name: Fetch Simple3D examples

on:
  pull_request:
    branches: [main]

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download official Simple3D examples
        run: |
          set -euxo pipefail
          mkdir -p out
          base=https://xeltalliv.github.io/simple3d-extension/examples/projects
          curl -L --fail --retry 5 -o out/texturesUV.sb3 "$base/meshTextures/texturesUV.sb3"
          curl -L --fail --retry 5 -o out/perspective9.sb3 "$base/transforms/perspective9.sb3"
          curl -L --fail --retry 5 -o out/controllerSimple.sb3 "$base/manualTransforms/controllerSimple.sb3"
          curl -L --fail --retry 5 -o out/import4.sb3 "$base/import/import4.sb3"
          curl -L --fail --retry 5 -o out/simple3D.js https://extensions.turbowarp.org/Xeltalliv/simple3D.js
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: simple3d-reference-files
          path: out
          retention-days: 1
